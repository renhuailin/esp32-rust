<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>配置WiFi</title>
    <style type="text/css">
        body {
            max-width: 500px;
            /* 移动端优先 */
            margin: auto;
            padding: 20px;
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .form-group {
            margin-bottom: 1.5em;
        }

        label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: bold;
        }

        .ssid-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select,
        input {
            width: 100%;
            height: 3.5em;
            /* 增大触控面积 */
            padding: 0 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button#refresh-btn {
            width: auto;
            white-space: nowrap;
            padding: 0 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
        }

        input[type="submit"] {
            background: #28a745;
            color: white;
            font-weight: bold;
            border: none;
        }
    </style>
</head>

<body>
    <h3>WiFi 设置</h3>
    <form id="the-form" action="/config_wifi" method="post">
        <div class="form-group">
            <label for="wifi_ssid">WiFi 名称:</label>
            <div class="ssid-container">
                <select id="wifi_ssid" name="wifi_ssid" disabled>
                    <option value="">正在扫描...</option>
                </select>
                <button type="button" id="refresh-btn">刷新</button>
            </div>
        </div>

        <div class="form-group">
            <label for="wifi_password">WiFi 密码:</label>
            <input type="password" id="wifi_password" name="wifi_password" placeholder="请输入密码">
        </div>

        <input type="submit" value="保存配置">
    </form>
    <p id="server-resp"></p>

    <script type="text/javascript">
        const ssidSelect = document.getElementById("wifi_ssid");
        const refreshBtn = document.getElementById("refresh-btn");
        const serverResp = document.getElementById("server-resp");

        // 获取 SSID 列表的函数
        async function fetchSSIDs() {
            ssidSelect.disabled = true;
            ssidSelect.innerHTML = '<option>正在扫描...</option>';
            try {
                // 替换成你的后端 URL
                let response = await fetch('/scan_wifi_ssid');
                let ssids = await response.json(); // 假设返回 ["WiFi-A", "WiFi-B"]

                ssidSelect.innerHTML = '';
                ssids.forEach(ssid => {
                    let opt = document.createElement('option');
                    opt.value = ssid;
                    opt.textContent = ssid;
                    ssidSelect.appendChild(opt);
                });
                ssidSelect.disabled = false;
            } catch (err) {
                ssidSelect.innerHTML = '<option>扫描失败，请重试</option>';
            }
        }

        // 绑定刷新事件
        refreshBtn.addEventListener("click", fetchSSIDs);

        // 页面加载自动扫描
        window.onload = fetchSSIDs;

        // 表单提交逻辑
        document.getElementById("the-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            let formData = new FormData(e.target);
            let data = Object.fromEntries(formData.entries());

            try {
                let resp = await fetch(e.target.action, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data),
                });
                serverResp.innerText = resp.ok ? "保存成功！" : "保存失败。";
            } catch (err) {
                serverResp.innerText = "请求错误: " + err.message;
            }
        });
    </script>
</body>

</html>
